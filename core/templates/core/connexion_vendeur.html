<!DOCTYPE html>
<html lang="fr">
{% load static %}
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Connexion Vendeur — Shopy</title>
  <link href="{% static 'core/css/connexion_vendeur.css' %}" rel="stylesheet">
</head>
<body>

<div class="login-container">
  <div class="login-card">
    
    <!-- Header -->
    <div class="login-header">
      <div class="login-icon">
        <span>🏪</span>
      </div>
      <h4 class="login-title">Se connecter à ma boutique</h4>
      <p class="login-subtitle">Gérez vos produits et commandes</p>
    </div>

    <!-- Error display (hidden by default) -->
    {% if erreur %}
    <span id="django-erreur" style="display:none;">{{ erreur }}</span>
    {% endif %}

    <!-- Login Form -->
    <form class="login-form" method="post" autocomplete="off">
      {% csrf_token %}
      
      <div class="form-group">
        <label class="form-label" for="id_nom_boutique">Nom de la boutique</label>
        <input 
          type="text" 
          name="nom_boutique" 
          id="id_nom_boutique" 
          class="form-input" 
          placeholder="Ex: AB STORE" 
          required
        >
      </div>
      
      <div class="form-group">
        <label class="form-label" for="id_mot_de_passe">Mot de passe</label>
        <input 
          type="password" 
          name="mot_de_passe" 
          id="id_mot_de_passe" 
          class="form-input" 
          placeholder="••••••••" 
          required
        >
      </div>
      
      <button type="submit" class="login-button">
        Se connecter
      </button>
    </form>

    <!-- Links -->
    <div class="login-links">
      <p class="login-link-text">
        Pas encore de boutique ?
        <a href="{% url 'inscription_vendeur' %}" class="login-link">Créer mon compte</a>
      </p>
    </div>

    <!-- Return Link -->
    <div style="margin-top: 12px;">
      <a href="{% url 'Welcome' %}" class="login-return">
        ← Retour à l'accueil
      </a>
    </div>

  </div>
</div>

<!-- Error Popup -->
<div id="popup-overlay" class="popup-overlay">
  <div class="popup-content">
    <div class="popup-icon">❌</div>
    <h5 class="popup-title">Erreur de connexion</h5>
    <p id="popup-message" class="popup-message"></p>
    <button 
      onclick="document.getElementById('popup-overlay').style.display='none'" 
      class="popup-button"
    >
      Réessayer
    </button>
  </div>
</div>

<script>
document.addEventListener('DOMContentLoaded', function() {
  const erreurEl = document.getElementById('django-erreur');
  if (erreurEl && erreurEl.textContent.trim()) {
    document.getElementById('popup-message').textContent = erreurEl.textContent;
    document.getElementById('popup-overlay').style.display = 'flex';
  }
});
</script>

</body>
</html>
