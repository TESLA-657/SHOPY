<!DOCTYPE html>
<html lang="fr">
<head>
  {% load static %}
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Créer mon compte — Shopy</title>
  <link href="{% static 'core/css/inscription_client.css' %}" rel="stylesheet">
</head>
<body>

<div class="register-container">
  <div class="register-card">
    
    <!-- Header -->
    <div class="register-header">
      <div class="register-icon">
        <span>🛒</span>
      </div>
      <h4 class="register-title">Créer mon compte</h4>
      <p class="register-subtitle"> Rejoignez SHOPY et commencez vos achats</p>
    </div>

    <!-- Error display -->
    {% if erreur %}
    <span id="django-erreur" style="display:none;">{{ erreur }}</span>
    {% endif %}

    <!-- Registration Form -->
    <form class="register-form" method="post" autocomplete="off">
      {% csrf_token %}
      
      <div class="form-group">
        <label class="form-label" for="id_nom">Nom complet</label>
        <input 
          type="text" 
          name="nom" 
          id="id_nom" 
          class="form-input" 
          placeholder="Ex: Mamadou Diallo" 
          required
        >
      </div>
      
      <div class="form-group">
        <label class="form-label" for="id_email">Email</label>
        <input 
          type="email" 
          name="email" 
          id="id_email" 
          class="form-input" 
          placeholder="exemple@gmail.com" 
          required
        >
      </div>
      
      <div class="form-group">
        <label class="form-label" for="id_numero">Numéro WhatsApp</label>
        <input 
          type="text" 
          name="numero" 
          id="id_numero" 
          class="form-input" 
          placeholder="+224 6XX XX XX XX" 
          required
        >
      </div>
      
      <div class="form-group">
        <label class="form-label" for="id_ville">Ville</label>
        <input 
          type="text" 
          name="ville" 
          id="id_ville" 
          class="form-input" 
          placeholder="Ex: Conakry" 
          required
        >
      </div>
      
      <div class="form-group">
        <label class="form-label" for="id_mot_de_passe">Mot de passe</label>
        <input 
          type="password" 
          name="mot_de_passe" 
          id="id_mot_de_passe" 
          class="form-input" 
          placeholder="••••••••" 
          autocomplete="new-password" 
          required
        >
      </div>
      
<div class="form-group">
        <label class="form-label" for="id_confirmer_mot_de_passe">Confirmer le mot de passe</label>
        <input 
          type="password" 
          name="confirmer_mot_de_passe" 
          id="id_confirmer_mot_de_passe" 
          class="form-input" 
          placeholder="••••••••" 
          autocomplete="new-password" 
          required
        >
      </div>
      
      <!-- CAPTCHA Section -->
      <div class="captcha-section">
        <label class="form-label">Vérification de sécurité</label>
        <p class="captcha-question">{{ captcha_question }}</p>
        <input 
          type="text" 
          name="captcha_answer" 
          id="id_captcha_answer" 
          class="form-input" 
          placeholder="Entrez la réponse (ex: 7)" 
          required
        >
        <button type="button" class="captcha-refresh" onclick="refreshCaptcha()">🔄 Nouvelle question</button>
      </div>
      
      <button type="submit" class="register-button">
        Créer mon compte
      </button>
    </form>

    <!-- Benefits -->
    <div class="benefits-section">
      <div class="benefit-item">
        <span>🚚</span>
        <span>Livraison</span>
      </div>
      <div class="benefit-item">
        <span>🛡️</span>
        <span>Garantie</span>
      </div>
      <div class="benefit-item">
        <span>💬</span>
        <span>Support</span>
      </div>
    </div>

    <!-- Links -->
    <div class="register-links">
      <p class="register-link-text">
        Déjà un compte ?
        <a href="{% url 'connexion_client' %}" class="register-link">Se connecter</a>
      </p>
    </div>

    <!-- Return Link -->
    <div style="margin-top: 8px;">
      <a href="{% url 'Welcome' %}" class="register-return">
        ← Retour à l'accueil
      </a>
    </div>

  </div>
</div>

<!-- Error Popup -->
<div id="popup-overlay" class="popup-overlay">
  <div class="popup-content">
    <div class="popup-icon">❌</div>
    <h5 class="popup-title">Erreur</h5>
    <p id="popup-message" class="popup-message"></p>
    <button 
      onclick="document.getElementById('popup-overlay').style.display='none'" 
      class="popup-button"
    >
      Réessayer
    </button>
  </div>
</div>

<script>
document.addEventListener('DOMContentLoaded', function() {
  const erreurEl = document.getElementById('django-erreur');
  if (erreurEl && erreurEl.textContent.trim()) {
    document.getElementById('popup-message').textContent = erreurEl.textContent;
    document.getElementById('popup-overlay').style.display = 'flex';
  }
});
</script>

</body>
</html>
