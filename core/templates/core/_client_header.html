{% load static %}
<!-- Client header partial: reusable header for client dashboard and client sections -->
<div class="client-header-premium">
  <div class="client-topbar">
    <a href="{% url 'parametres_client' %}" class="client-settings-btn" title="Réglages" aria-label="Réglages du compte"><i class="bi bi-sliders" aria-hidden="true"></i></a>
  </div>

  <div class="client-stats-row">
    <div class="client-stat-item glass-card">
      <i class="bi bi-bag client-stat-icon" aria-hidden="true"></i>
      <div>
        <p class="client-stat-label">Total commandes</p>
        <p class="client-stat-value">{{ commandes|length }}</p>
      </div>
    </div>
    {% if nb_commandes_acceptees > 0 %}
    <div class="client-stat-badge"><i class="bi bi-check-circle" aria-hidden="true"></i> {{ nb_commandes_acceptees }} acceptée(s)</div>
    {% endif %}
  </div>

  <div class="dashboard-profile glass-card profile-card">
    <form method="post" action="{% url 'upload_photo_client' %}" enctype="multipart/form-data" id="photo-form-client">
      {% csrf_token %}
      <label for="photo-input-client" class="client-avatar-wrapper">
        <span class="client-avatar-frame">
          {% if client.photo %}
            <img src="{{ client.photo.url }}" alt="{{ client.nom }}" class="client-avatar-img" {% if client.photo %}onclick="voirPhoto('{{ client.photo.url }}')"{% endif %}>
          {% else %}
            <span class="client-avatar-placeholder">{{ client.nom|first|upper }}</span>
          {% endif %}
        </span>
        <div class="client-avatar-edit"><i class="bi bi-camera" aria-hidden="true"></i></div>
        <span class="client-online-dot"></span>
      </label>
      <input type="file" id="photo-input-client" name="photo" accept="image/*" onchange="document.getElementById('photo-form-client').submit()">
    </form>

    <div class="dashboard-profile-info">
      <p class="dashboard-salutation">{{ salutation }}</p>
      <h3 class="dashboard-name">{{ client.nom }}</h3>
      <div class="dashboard-meta">
        <span class="dashboard-verified"><i class="bi bi-patch-check-fill" aria-hidden="true"></i> Client vérifié</span>
        <span class="dashboard-city"><i class="bi bi-geo-alt" aria-hidden="true"></i> {{ client.ville }}</span>
        <span class="dashboard-city"><i class="bi bi-telephone" aria-hidden="true"></i> {{ client.numero }}</span>
        <a href="{% url 'mode_emploi' %}" class="dashboard-city" style="text-decoration:none;"><i class="bi bi-book" aria-hidden="true"></i> Guide d'utilisation</a>
      </div>
    </div>
  </div>
</div>

<style>
.client-header-premium {
  position: relative;
  overflow: hidden;
  padding: 24px 18px 72px;
  background: linear-gradient(180deg, #1b1f26 0%, #15181d 100%);
  border-bottom: 1px solid rgba(255,255,255,0.07);
}
.client-topbar { display:flex; justify-content:flex-end; position:relative; z-index:3; margin-bottom:6px; }
.client-settings-btn { display:inline-flex; align-items:center; justify-content:center; width:38px; height:38px; border-radius:50%; text-decoration:none; font-size:19px; line-height:1; color:#c9d1d9; background:rgba(255,255,255,0.06); border:1px solid rgba(255,255,255,0.12); transition:background .18s ease; }
.client-settings-btn:hover { background:rgba(255,255,255,0.14); }
.client-stats-row { display:flex; align-items:center; justify-content:space-between; gap:12px; margin-bottom:16px; position:relative; z-index:2 }
.glass-card { background: rgba(255,255,255,0.06); border:1px solid rgba(255,255,255,0.1) }
.client-stat-item { display:flex; align-items:center; gap:10px; padding:10px 12px; border-radius:16px; color:white }
.client-stat-icon { font-size:20px; background: rgba(255,255,255,0.1); width:42px; height:42px; border-radius:12px; display:flex; align-items:center; justify-content:center }
.client-stat-value { margin:0; font-size:20px; font-weight:800; color:white }
.client-stat-label { margin:0; font-size:11px; opacity:0.82; color:rgba(255,255,255,0.8); text-transform:uppercase; letter-spacing:0.06em }
.client-stat-badge { background: rgba(255,255,255,0.08); color:#d7dde5; padding:8px 12px; border-radius:999px; font-size:12px; font-weight:700; display:flex; align-items:center; gap:6px; border:1px solid rgba(255,255,255,0.12) }
.dashboard-profile {
  display:flex;
  flex-wrap: wrap;
  align-items:center;
  gap:16px;
  padding:16px;
  border-radius:20px;
  position:relative;
  z-index:2;
  background: rgba(22, 27, 34, 0.72);
  border:1px solid rgba(255,255,255,0.1);
}
.dashboard-profile-info { flex:1 1 220px; min-width:0; color:white }
.dashboard-salutation { margin:0 0 4px 0; font-size:14px; opacity:0.9 }
.dashboard-name { margin:0 0 8px 0; font-size:22px; font-weight:800; color:#ffffff; word-break:break-word; overflow-wrap:anywhere }
.dashboard-meta { display:flex; flex-wrap:wrap; gap:8px; font-size:12px; max-width:100% }
.dashboard-verified, .dashboard-city { flex:0 1 auto; overflow-wrap:anywhere; background: rgba(255,255,255,0.08); color:#ebf2ff; padding:6px 10px; border-radius:999px; border:1px solid rgba(255,255,255,0.12) }
.client-avatar-wrapper { position:relative; width:86px; height:86px; aspect-ratio:1; flex-shrink:0; cursor:pointer; border-radius:50%; overflow:visible; background:transparent; transition:all 0.18s ease-out; }
.client-avatar-wrapper:hover { transform:translateY(-2px) scale(1.02); }
.client-avatar-frame { position:absolute; inset:0; display:block; width:100%; height:100%; aspect-ratio:1; overflow:hidden; border:3px solid rgba(255,255,255,0.55); border-radius:50%; background:#16202d; }
.client-avatar-img, .client-avatar-placeholder { display:block; width:100%; height:100%; border-radius:50%; object-fit:cover; border:0; }
.client-avatar-placeholder { display:flex; align-items:center; justify-content:center; font-size:28px; font-weight:700; color:white; background:#2f3742; }
.client-avatar-edit { position:absolute; right:0; bottom:0; width:28px; height:28px; border:2px solid rgba(255,255,255,0.7); border-radius:50%; background:#3b4757; display:flex; align-items:center; justify-content:center; font-size:12px; opacity:1; }
.client-online-dot { position:absolute; right:-4px; top:-4px; width:15px; height:15px; border:3px solid #16202d; border-radius:50%; background:#3ba55d; }
</style>
