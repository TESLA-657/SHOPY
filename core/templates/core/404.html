{% extends "core/base.html" %}

{% block title %}Page Non Trouvée - SHOPY{% endblock %}

{% block content %}
<div class="error-container">
    <div class="error-content">
        <div class="error-code text-center">404</div>
        <h1 class="error-title text-center mt-3">Page Non Trouvée</h1>
        <p class="error-message text-center text-muted">Désolé, la page que vous recherchez n'existe pas ou a été déplacée.</p>
        <div class="text-center mt-4">
            <a href="{% url 'Welcome' %}" class="btn btn-primary me-2">🏠 Accueil</a>
            <a href="{% url 'catalogue' %}" class="btn btn-outline-primary me-2">📦 Catalogue</a>
            <a href="{% url 'contact' %}" class="btn btn-outline-secondary">💬 Contact</a>
        </div>
    </div>
</div>

<style>
.error-container {
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 60vh;
    padding: 20px;
    background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
}
.error-content {
    text-align: center;
    max-width: 500px;
}
.error-code {
    font-size: 120px;
    font-weight: bold;
    color: #1a73e8;
    opacity: 0.3;
    line-height: 1;
}
.error-title {
    font-size: 28px;
    color: #333;
}
.error-message {
    font-size: 16px;
}
.btn {
    padding: 10px 20px;
    border-radius: 5px;
    text-decoration: none;
    font-weight: 500;
}
.btn-primary {
    background: #1a73e8;
    color: white;
    border: none;
}
.btn-outline-primary {
    border: 2px solid #1a73e8;
    color: #1a73e8;
    background: white;
}
.btn-outline-secondary {
    border: 2px solid #6c757d;
    color: #6c757d;
    background: white;
}
.btn:hover {
    opacity: 0.9;
    transform: translateY(-1px);
}
</style>
{% endblock %}
