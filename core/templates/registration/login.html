<!DOCTYPE html>
<html lang="fr">
<head>
    {% load static %}
    <meta charset="UTF-8">
    <title>Connexion - SHOPY</title>
    <style>
        body { font-family: sans-serif; background: #f4f7f6; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .login-box { background: white; padding: 30px; border-radius: 12px; box-shadow: 0 5px 15px rgba(0,0,0,0.1); width: 350px; }
        h2 { text-align: center; color: #2ecc71; }
        input { width: 100%; padding: 10px; margin: 10px 0; border: 1px solid #ddd; border-radius: 5px; }
        button { width: 100%; padding: 10px; background: #2ecc71; color: white; border: none; border-radius: 5px; cursor: pointer; font-weight: bold; }
        .password-toggle { color: var(--text-secondary, #6b7280); }
    </style>
    <link href="{% static 'core/css/password-toggle.css' %}" rel="stylesheet">
</head>
<body>
    <div class="login-box">
        <h2>Connexion Vendeur</h2>
        <form method="post">
            {% csrf_token %}
            {{ form.as_p }}
            <button type="submit">Se connecter</button>
        </form>
    </div>

    <!-- Afficher / masquer le mot de passe (icône œil) -->
    <script src="{% static 'core/js/password-toggle.js' %}"></script>
</body>
</html>
