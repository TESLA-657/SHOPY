services:
  - type: web
    name: shopy
    runtime: python
    buildCommand: "./build.sh"
    startCommand: "gunicorn marketplace.wsgi:application --bind 0.0.0.0:$PORT --workers 2"
    envVars:
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DJANGO_DEBUG
        value: "False"
      - key: DJANGO_ALLOWED_HOSTS
        value: "shopy.onrender.com"
      - key: PYTHON_VERSION
        value: "3.11.0"
      - key: DATABASE_URL
        fromDatabase:
          name: shopy-db
          property: connectionString

databases:
  - name: shopy-db
    plan: free
