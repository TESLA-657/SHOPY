services:
  - type: web
    name: shopy
    runtime: python
    buildCommand: "./build.sh"
    startCommand: "gunicorn marketplace.wsgi:application --bind 0.0.0.0:$PORT --workers 2"
    envVars:
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DJANGO_DEBUG
        value: "False"
      - key: DJANGO_ALLOWED_HOSTS
        value: "shopy.onrender.com"
      # --- Compte admin (créé automatiquement par build.sh) ---
      # sync: false → la valeur doit être saisie dans le dashboard Render
      # (Service → Environment) puis "Manual Deploy → Clear build cache & Deploy"
      - key: DJANGO_SUPERUSER_USERNAME
        sync: false
      - key: DJANGO_SUPERUSER_EMAIL
        sync: false
      - key: DJANGO_SUPERUSER_PASSWORD
        sync: false
      # --- Service d'envoi d'emails Resend ---
      # sync: false → saisir la cle dans le dashboard Render
      # (Service → Environment) puis "Manual Deploy → Clear build cache & Deploy"
      - key: RESEND_API_KEY
        sync: false
      - key: RESEND_FROM_EMAIL
        sync: false
      - key: PYTHON_VERSION
        value: "3.11.0"
      - key: DATABASE_URL
        fromDatabase:
          name: shopy-db
          property: connectionString

databases:
  - name: shopy-db
    plan: free
